%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/sprd,sc9860-mcdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum Multi-Channel Data Transfer controller

description:
  The Multi-channel data transfer controller is used for sound stream
  transmission between the audio subsystem and other AP/CP subsystem. It
  supports 10 DAC channels and 10 ADC channels, and each channel can be
  configured with DMA mode or interrupt mode.

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>

properties:
  compatible:
    enum:
      - sprd,sc9860-mcdt
      - sprd,roc1-mcdt

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description: Optional access clock, held while a channel is allocated.

  sprd,ap-addr-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Offset subtracted from the AP physical FIFO address to obtain the
      address used by the ROC1 audio DMA controller.

allOf:
  - if:
      properties:
        compatible:
          const: sprd,sc9860-mcdt
    then:
      properties:
        sprd,ap-addr-offset: false

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    mcdt@41490000 {
      compatible = "sprd,sc9860-mcdt";
      reg = <0x41490000 0x170>;
      interrupts = <GIC_SPI 48 IRQ_TYPE_LEVEL_HIGH>;
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    mcdt@56490000 {
      compatible = "sprd,roc1-mcdt";
      reg = <0x56490000 0x170>;
      interrupts = <GIC_SPI 118 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&audio_access>;
      sprd,ap-addr-offset = <0x55000000>;
    };
...
