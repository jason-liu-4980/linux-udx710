%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/sprd,orca-usb-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Spreadtrum Orca USB and PAM reset controller
maintainers:
  - Jiayong Yang <jiayong.yang@unisoc.com>
description: |
  Group 0 is USB0 AP AHB bit 1. Group 1 combines USB1 and PAM IPA AHB bits 0
  and 5 for PHY/controller startup. Reset 2 pulses only PAM bit 5 for
  accelerator reinitialization. PAM holds a controller runtime-PM reference
  and quiesces its DMA before using reset 2.
properties:
  compatible:
    const: sprd,orca-usb-reset
  '#reset-cells':
    const: 1
  sprd,ap-ahb:
    description: AP AHB system controller containing the USB0 reset bit.
    $ref: /schemas/types.yaml#/definitions/phandle
  sprd,ipa-ahb:
    description: IPA AHB system controller containing the USB1 and PAM reset bits.
    $ref: /schemas/types.yaml#/definitions/phandle
required: [compatible, '#reset-cells', 'sprd,ap-ahb', 'sprd,ipa-ahb']
additionalProperties: false
