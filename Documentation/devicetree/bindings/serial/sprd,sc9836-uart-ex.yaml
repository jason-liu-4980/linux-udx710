%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/sprd,sc9836-uart-ex.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SP UART with PM system interrupt proxy

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>

description: |
  SP UART uses the PM system SIPC notification endpoint to deliver receive
  notifications. Its own interrupt is described for the hardware, but the
  Linux driver leaves interrupt ownership with the PM firmware. The driver
  retains the existing 26 MHz parent/rate rather than reprogramming shared
  clock domains. A serial peripheral may be attached as a child node.

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: sprd,sc9836-uart-ex
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    maxItems: 3
  clock-names:
    items:
      - const: enable
      - const: uart
      - const: source

required: [compatible, reg, clocks, clock-names]
unevaluatedProperties: false
