%YAML 1.2
---
$id: http://devicetree.org/schemas/power/reset/sprd,sc2730-poweroff.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Spreadtrum SC2730 PMIC system power-off
maintainers:
  - Baolin Wang <baolin.wang@unisoc.com>
description: |
  SC2730 system power-off block under the ADI/SPI PMIC. The power-down
  sequence executes in the sleepable system power-off preparation phase,
  with PSCI as the final firmware fallback.
properties:
  compatible:
    const: sprd,sc2730-poweroff
  reg:
    items:
      - const: 0x1820
required: [compatible, reg]
additionalProperties: false
