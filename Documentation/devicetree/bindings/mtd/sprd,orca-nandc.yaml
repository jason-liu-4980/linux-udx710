%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/sprd,orca-nandc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum Orca NAND flash controller

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>

description: |
  Orca parallel NAND controller with hardware BCH ECC. The nine clocks name
  the NAND/ECC sources, selectable SDR/DDR parents and their separate gates.
  The current controller interface attaches one NAND chip at chip select zero.

allOf:
  - $ref: nand-controller.yaml#

properties:
  compatible:
    const: sprd,orca-nandc
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    maxItems: 9
  clock-names:
    items:
      - const: nandc_clk
      - const: nandc_ecc_clk
      - const: nandc_parent_sdr
      - const: nandc_parent_ddr
      - const: nandc_ahb_enable
      - const: nandc_ecc_enable
      - const: nandc_26m_enable
      - const: nandc_1x_enable
      - const: nandc_2x_enable
  sprd,random-mode:
    type: boolean
    description: Enable the controller data randomizer for the board NAND format.

patternProperties:
  '^nand@[0-9a-f]+$':
    type: object
    $ref: raw-nand-chip.yaml#
    properties:
      reg:
        items:
          - const: 0
    unevaluatedProperties: false

required: [compatible, reg, clocks, clock-names]
unevaluatedProperties: false
