%YAML 1.2
---
$id: http://devicetree.org/schemas/net/sprd,orca-sipa.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc ORCA and ROC1 SIPA packet accelerator

maintainers:
  - jason-liu-4980 <38558962+jason-liu-4980@users.noreply.github.com>

description: |
  SIPA owns the hardware packet FIFOs and resource manager. ORCA uses a
  local CP producer; a PCIe transport can be explicitly selected for
  platforms that route packets through PCIe. Producer registration and
  resource grants are performed by the corresponding runtime delegate.

properties:
  compatible:
    enum:
      - sprd,orca-sipa
      - sprd,roc1-sipa
  reg:
    maxItems: 2
  reg-names:
    items:
      - const: glb-base
      - const: iram-base
  interrupts:
    maxItems: 1
  interrupt-names:
    const: local_ipa_irq
  sprd,modem:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Modem remote processor that owns the cellular channels.
  sprd,enable-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: IPA enable syscon, register offset and enable bit mask.
    items:
      - items:
          - description: Syscon phandle
          - description: Register offset
          - description: Enable bit mask
  sprd,sipa-bypass-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Hardware bypass mode selection.
    enum: [0, 1]
  sprd,tft-mode:
    type: boolean
    description: Use the traffic flow template mode.
  sprd,wiap-ul-dma:
    type: boolean
    description: Use Wi-Fi AP uplink DMA.
  sprd,need-through-pcie:
    type: boolean
    description: Route the remote USB producer through PCIe.
  sprd,cp-transport:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PCIe SIPC transport for a remote USB resource producer.
  sprd,from-pcie-no-mac:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Legacy receive PCIe framing flag.
    enum: [0, 1]
  sprd,to-pcie-no-mac:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Legacy transmit PCIe framing flag.
    enum: [0, 1]
  vpower-supply:
    description: Power supply for a standalone SIPA subsystem.

patternProperties:
  '^sprd,(usb|cp|wifi|ap-eth|ap-ip)-(dl|ul)-(tx|rx)$':
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: FIFO location (zero for DDR, one for IRAM) and descriptor count.
    items:
      - enum: [0, 1]
      - minimum: 0

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - sprd,enable-syscon

allOf:
  - if:
      required:
        - sprd,need-through-pcie
    then:
      required:
        - sprd,cp-transport
    else:
      properties:
        sprd,cp-transport: false

additionalProperties: false
