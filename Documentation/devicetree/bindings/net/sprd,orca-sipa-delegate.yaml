%YAML 1.2
---
$id: http://devicetree.org/schemas/net/sprd,orca-sipa-delegate.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc ORCA SIPA CP resource delegate

maintainers:
  - jason-liu-4980 <38558962+jason-liu-4980@users.noreply.github.com>

description: |
  The delegate registers the CP producer and exchanges its resource
  request, grant and release messages over SIPC. SIPA and SIPC binding
  does not imply that CP has granted a resource request.

properties:
  compatible:
    enum:
      - sprd,orca-sipa-delegate
      - sprd,roc1-sipa-delegate
  reg:
    maxItems: 2
  reg-names:
    items:
      - const: mem-base
      - const: reg-base
  sprd,sipa:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SIPA supplying the resource manager and shared FIFOs.
  sprd,cp-transport:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PSCP SIPC transport used for resource protocol messages.
  sprd,ul-fifo-depth:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Number of descriptors in the CP uplink FIFO.
  sprd,dl-fifo-depth:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Number of descriptors in the CP downlink FIFO.

required:
  - compatible
  - reg
  - reg-names
  - sprd,sipa
  - sprd,cp-transport
  - sprd,ul-fifo-depth
  - sprd,dl-fifo-depth

additionalProperties: false
