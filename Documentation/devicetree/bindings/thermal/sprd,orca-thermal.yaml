%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/sprd,orca-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc Orca thermal sensor controller

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>

$ref: thermal-sensor.yaml#

properties:
  compatible:
    const: sprd,orca-thermal

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2
    description:
      Bus enable gate followed optionally by the controller functional mux.
      On Orca the THM0/1/2 muxes select ext-32k or ext-26m divided by 104.
      Supplying the mux establishes clock ownership without changing its
      boot-selected parent or rate. Legacy gate-only descriptions are accepted;
      neither description by itself establishes the sampling period in seconds.

  clock-names:
    minItems: 1
    items:
      - const: enable
      - const: functional

  nvmem-cells:
    maxItems: 2
    description:
      One-bit sign and seven-bit ratio calibration values. Cells must provide
      little-endian, zero-extended values. An Orca-compatible NVMEM provider
      must interpret offsets as bytes, not fuse block numbers.

  nvmem-cell-names:
    items:
      - const: thm_sign_cal
      - const: thm_ratio_cal

  "#thermal-sensor-cells":
    const: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^([a-z0-9]+-)?sensor@[0-7]$":
    type: object
    description:
      Represent one thermal sensor.

    properties:
      reg:
        description: Specify the sensor id.
        maxItems: 1

      nvmem-cells:
        maxItems: 1
        description:
          Eight-bit delta calibration, in 250 millicelsius steps around 128.
          The controller uses a nominal slope of 262 millicelsius per raw
          code and an offset of 66400 millicelsius.

      nvmem-cell-names:
        const: sen_delta_cal

    required:
      - reg
      - nvmem-cells
      - nvmem-cell-names

    additionalProperties: false

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - nvmem-cells
  - nvmem-cell-names
  - "#address-cells"
  - "#size-cells"

unevaluatedProperties: false

examples:
  - |
    thermal@63410000 {
        compatible = "sprd,orca-thermal";
        reg = <0x63410000 0x10000>;
        clock-names = "enable";
        clocks = <&aonapb_gate 52>;
        #thermal-sensor-cells = <1>;
        nvmem-cells = <&thm0_sign>, <&thm0_ratio>;
        nvmem-cell-names = "thm_sign_cal", "thm_ratio_cal";
        #address-cells = <1>;
        #size-cells = <0>;

        prometheus-sensor@0 {
            reg = <0>;
            nvmem-cells = <&thm0_sen0>;
            nvmem-cell-names = "sen_delta_cal";
        };

        ank-sensor@1 {
            reg = <1>;
            nvmem-cells = <&thm0_sen1>;
            nvmem-cell-names = "sen_delta_cal";
        };
    };
...
