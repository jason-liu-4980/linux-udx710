%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/sprd/sprd,sysdump.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum bootloader system dump memory selection

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>

description: |
  The installed bootloader finds /sprd-sysdump by path and reads the selected
  physical memory and reserved-region phandles during dump collection. The
  legacy property names are part of that interface.

select:
  properties:
    $nodename:
      const: sprd-sysdump
  required: [$nodename]

properties:
  memory-region:
    description: Physical memory node selected by the bootloader.
    maxItems: 1
  memory-region-re:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: Reserved-region handles used by the legacy dump collector.
  memory-region-se:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: Optional separately selected dump regions.
  version:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Legacy dump format selector; absent means version zero.

required: [memory-region]
additionalProperties: false
