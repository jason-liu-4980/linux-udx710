%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/sprd,udx710-pmsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum UDX710 PM_SYS Cortex-M4 firmware loader

maintainers:
  - jason-liu-4980 <38558962+jason-liu-4980@users.noreply.github.com>

description: |
  PM_SYS runs the board's original raw firmware through the firmware loader. Its
  Cortex-M4 remains held in reset until the SIPC mailbox receiver is
  registered.

properties:
  compatible:
    const: sprd,udx710-pmsys
  reg:
    maxItems: 1
  sprd,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: AON APB syscon containing the PM_SYS reset register.
  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    const: sprd/udx710-pmsys.bin
    description: Original raw firmware prepared by userspace.

required:
  - compatible
  - reg
  - sprd,aon-apb
  - firmware-name

additionalProperties: false
