%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/sprd,udx710-modem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UDX710 modem subsystem

maintainers:
  - jason-liu-4980 <38558962+jason-liu-4980@users.noreply.github.com>

description: |
  The modem CP, V3 PHY and NR PHY share one boot lifecycle. All original
  raw firmware, DSP images, prepared NV and the modem command line must be
  loaded before any core is released. There is no ELF resource table.
  The reserved modem memory also contains SIPC and SIPA shared buffers;
  only the named image windows are loaded by this device.

properties:
  compatible:
    const: sprd,udx710-modem

  reg:
    minItems: 12
    maxItems: 12

  reg-names:
    items:
      - const: cp-iram
      - const: v3-iram
      - const: nr-iram
      - const: modem
      - const: v3phy
      - const: nrphy
      - const: nrdsp1
      - const: nrdsp2
      - const: deltanv
      - const: cpcmdline
      - const: fixnv
      - const: runnv

  memory-region:
    maxItems: 1

  firmware-name:
    description: Raw files in the same order as the nine image windows.
    minItems: 9
    maxItems: 9

  sprd,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: AON APB syscon containing the core reset controls.

  sprd,pmu-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PMU APB syscon containing sleep, shutdown and system reset controls.

  sprd,cp-iram-data:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Original CP ARM bootstrap instructions and literal data.
    minItems: 49
    maxItems: 49

  sprd,v3-iram-data:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Original V3 PHY ARM bootstrap instructions and literal data.
    minItems: 49
    maxItems: 49

  sprd,nr-iram-data:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Original NR PHY ARM bootstrap instructions and literal data.
    minItems: 49
    maxItems: 49

required:
  - compatible
  - reg
  - reg-names
  - memory-region
  - firmware-name
  - sprd,aon-apb
  - sprd,pmu-apb
  - sprd,cp-iram-data
  - sprd,v3-iram-data
  - sprd,nr-iram-data

additionalProperties: false
