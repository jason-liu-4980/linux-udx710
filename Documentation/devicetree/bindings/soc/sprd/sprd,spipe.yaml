%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/sprd/sprd,spipe.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SIPC shared byte-ring pipe

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>

description: |
  Legacy SIPC shared-memory endpoint instantiated for the firmware ABI.
  These nodes describe protocol channels, not MMIO addresses. Destination
  and channel select the existing SIPC transport; buffer geometry must agree
  with the peer firmware.

properties:
  compatible:
    const: sprd,spipe
  sprd,name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Userspace device name.
  sprd,dst:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: SIPC destination ID.
  sprd,channel:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: SMSG channel ID.
  sprd,ringnr:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Number of shared byte rings.
  sprd,size-rxbuf:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Receive ring capacity in bytes.
  sprd,size-txbuf:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Transmit ring capacity in bytes; zero is valid for receive-only pipes.

required:
  - compatible
  - sprd,name
  - sprd,dst
  - sprd,channel
  - sprd,ringnr
  - sprd,size-rxbuf
  - sprd,size-txbuf
additionalProperties: false
