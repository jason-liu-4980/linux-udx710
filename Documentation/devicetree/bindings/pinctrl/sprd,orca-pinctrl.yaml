additionalProperties: false

examples:
  - |
    pinctrl@63450000 {
        compatible = "sprd,orca-pinctrl";
        reg = <0x63450000 0x10000>;

        spi0-pins {
            pins = "ORCA_SPI0_CLK", "ORCA_SPI0_DO";
            function = "func1";
            sprd,sleep-mode = <1>;

            spi0-sleep {
                pins = "ORCA_SPI0_CLK", "ORCA_SPI0_DO";
                sleep-hardware-state;
                output-enable;
            };
        };

        spi0-pad-pins {
            pins = "ORCA_SPI0_CLK_MISC", "ORCA_SPI0_DO_MISC";
            drive-strength = <10>;
            bias-pull-up = <20000>;
        };
    };
