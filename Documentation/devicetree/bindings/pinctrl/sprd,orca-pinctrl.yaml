%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/sprd,orca-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum Orca (UDX710) Pin Controller

maintainers:
  - Bruce Chen <bruce.chen@unisoc.com>

description: |
  Orca exposes global control fields, 174 common pad registers starting at
  offset 0x30, and 174 miscellaneous pad registers starting at offset 0x430.
  The common and miscellaneous registers are spaced four bytes apart.
  Global control fields retain the names and field layout of the vendor BSP.

  Register layouts and pull resistor encodings differ from SC9860, so an
  SC9860 fallback compatible is not valid. The controller has no interrupt
  or GPIO-provider interface in this binding.

  Sleep-domain bits 0 through 3 select AP, PUBCP, TGLDSP and AGDSP, matching
  the implemented Orca BSP behavior. Further domains need hardware evidence.
  Hardware-controlled sleep states do not imply that Linux controls CP or
  DSP firmware or their power state.

  In sleep-hardware-state nodes, output-enable and output-disable control
  the sleep output buffer. The legacy BSP output-high and output-low both
  enabled that buffer without selecting a signal level; use output-enable
  when translating those legacy properties. Do not infer output voltage or
  logic level from this operation.

properties:
  compatible:
    const: sprd,orca-pinctrl

  reg:
    maxItems: 1

patternProperties:
  '^[a-z][a-z0-9-]*-pins$':
    $ref: '#/$defs/pin-node'
    unevaluatedProperties: false

    properties:
      input-enable: false
      input-disable: false
      output-enable: false
      output-disable: false
      bias-high-impedance: false
      output-high: false
      output-low: false

      function:
        enum: [func1, func2, func3, func4]

      drive-strength:
        enum: [2, 4, 6, 8, 10, 12, 14, 16, 20, 21, 24, 25, 27, 29, 31, 33]

      input-schmitt-enable: true
      input-schmitt-disable: true

      bias-pull-up:
        enum: [20000, 4700]

      sprd,sleep-mode:
        description: Mask of the four sleep domains documented above.
        $ref: /schemas/types.yaml#/definitions/uint32
        maximum: 15

      sprd,control:
        description: Value of a named global register bit field.
        $ref: /schemas/types.yaml#/definitions/uint32

    patternProperties:
      '^[a-z][a-z0-9-]*-pins$':
        $ref: '#/$defs/pin-node'
        unevaluatedProperties: false
        description: Independently referenced pad configuration beneath a mux group.
        properties:
          sprd,sleep-mode:
            $ref: /schemas/types.yaml#/definitions/uint32
            maximum: 15
            description: Sleep-domain selector of the pad register.

      '^[a-z][a-z0-9-]*-sleep$':
        $ref: '#/$defs/pin-node'
        unevaluatedProperties: false

        properties:
          sleep-hardware-state: true
          bias-pull-up:
            type: boolean
          output-high: false
          output-low: false
          output-enable: true
          output-disable: true
          bias-high-impedance: true

        required:
          - sleep-hardware-state

