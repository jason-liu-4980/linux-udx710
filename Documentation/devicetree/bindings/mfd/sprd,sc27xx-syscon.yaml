%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/sprd,sc27xx-syscon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC2730 legacy analog system registers

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>

description: |
  Legacy SC2730 descriptor for analog chip identification, charger detection
  and charger control. Register addresses are offsets in the parent ADI regmap.
  The SC2730 global register map names offsets 0x1800, 0x1ba0 and 0x1b98 as
  CHIP_ID_LOW, CHGR_DET_FGU_CTRL and CHGR_CTRL respectively. This node is kept
  as a hardware description; Linux functional children use the parent regmap.

properties:
  compatible:
    const: sprd,sc27xx-syscon
  reg:
    items:
      - description: Chip identification low register.
      - description: Charger detection and fuel gauge control register.
      - description: Charger control register.

required: [compatible, reg]
additionalProperties: false
