%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/sprd,orca-efuse.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum Orca public read-only eFuse

description: |
  The byte-addressed public region covers hardware blocks 2 through 46
  inclusive (180 bytes). Offset zero maps to hardware block 2. All public
  blocks use the redundant double-bit read mode. The 8-byte UID at offset
  0xb4 maps hardware blocks 0 and 1 in double-bit mode, with bit 31 of each
  word cleared as in the original UID format. Calibration offsets remain
  unchanged. The resulting read-only NVMEM view is 188 bytes. The driver
  provides no programming operation. Thermal calibration uses the standard NVMEM cell
  bits property; no calibrated values are encoded in this binding.

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>

properties:
  compatible:
    const: sprd,orca-efuse

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: enable

  hwlocks:
    maxItems: 1

  nvmem-layout:
    $ref: layouts/fixed-layout.yaml#

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - hwlocks

allOf:
  - $ref: nvmem.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sprd,orca-clk.h>

    efuse@63400000 {
      compatible = "sprd,orca-efuse";
      reg = <0x63400000 0x10000>;
      clocks = <&aonapb_gate CLK_EFUSE_EB>;
      clock-names = "enable";
      hwlocks = <&hwlock 8>;
      nvmem-layout {
          compatible = "fixed-layout";
          #address-cells = <1>;
          #size-cells = <1>;

          uid@b4 {
            reg = <0xb4 0x8>;
          };

          /* Calibration cells */
          thermal_calib: calib@98 {
            reg = <0x98 0x4>;
            bits = <1 7>;
          };
      };
    };
...
